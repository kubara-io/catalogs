name: catalog checks

on:
  push:
    branches: [main]
    paths:
      - "bootstrap/**"
      - "general/**"
      - ".scripts/**"
      - ".github/workflows/pr-checks.yaml"
  pull_request:
    branches: [main]
    paths:
      - "bootstrap/**"
      - "general/**"
      - ".scripts/**"
      - ".github/workflows/pr-checks.yaml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep catalog validation aligned with the CLI implementation used by kubara.
  KUBARA_REF: main
  # renovate: datasource=github-releases depName=terraform-linters/tflint
  TFLINT_VERSION: "v0.63.1"

jobs:
  catalog-packaging:
    name: Validate catalog packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout catalogs
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Checkout kubara CLI
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: kubara-io/kubara
          ref: ${{ env.KUBARA_REF }}
          path: .ci/kubara

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: .ci/kubara/src/go.mod
          cache-dependency-path: .ci/kubara/src/go.sum

      - name: Build kubara CLI
        working-directory: .ci/kubara/src
        run: go build -o "${RUNNER_TEMP}/kubara" .

      - name: Validate catalog packaging
        env:
          HOME: ${{ runner.temp }}/kubara-home
        run: |
          set -euo pipefail
          for catalog in bootstrap general; do
            echo "::group::Package ${catalog}"
            (
              cd "${catalog}"
              "${RUNNER_TEMP}/kubara" catalog package oci://local.invalid/kubara/catalogs/
            )
            echo "::endgroup::"
          done

  helm:
    name: Validate Helm charts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout catalogs
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify Helm
        run: helm version --short

      - name: Run Helm checks
        run: .scripts/helm-checks.sh

  terraform:
    name: Validate Terraform modules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout catalogs
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.9.3

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: Run Terraform checks
        run: .scripts/terraform-checks.sh
