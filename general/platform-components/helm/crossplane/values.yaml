---
namespace: {}
crossplane:
  replicas: 1
  deploymentStrategy: RollingUpdate
  hostNetwork: false
  dnsPolicy: ""
  serviceAccount:
    create: true
    name: ""
  leaderElection: true
  webhooks:
    enabled: true
    port: ""
  rbacManager:
    deploy: true
    skipAggregatedClusterRoles: false
    replicas: 1
    leaderElection: true
    args: []
  priorityClassName: ""
  runtimeClassName: ""
  resourcesCrossplane:
    limits:
      cpu: 500m
      memory: 1024Mi
    requests:
      cpu: 100m
      memory: 256Mi
  resourcesRBACManager:
    limits:
      cpu: 100m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  metrics:
    enabled: false
    port: ""
  readiness:
    port: ""
