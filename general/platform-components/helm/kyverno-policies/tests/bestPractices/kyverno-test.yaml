---
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
context: context.yaml
metadata:
  name: best-practices-tests
policies:
  - /tmp/kyverno-policies.yaml
resources:
  - resources/pod.yaml
  - resources/pod-controller.yaml
  - resources/pdb.yaml
variables: variables.yaml
results:
  ###
  # disallow default namespace
  ###
  - policy: disallow-default-namespace
    resources:
      - bad-pod
    kind: Pod
    result: fail
  - policy: disallow-default-namespace
    resources:
      - good-pod
    kind: Pod
    result: pass
  - policy: disallow-default-namespace
    resources:
      - allowed-daemonset
    kind: DaemonSet
    result: pass
  - policy: disallow-default-namespace
    resources:
      - blocked-daemonset
    kind: DaemonSet
    result: fail
  - policy: disallow-default-namespace
    resources:
      - allowed-deployment
    kind: Deployment
    result: pass
  - policy: disallow-default-namespace
    resources:
      - blocked-deployment
    kind: Deployment
    result: fail
  - policy: disallow-default-namespace
    resources:
      - allowed-job
    kind: Job
    result: pass
  - policy: disallow-default-namespace
    resources:
      - blocked-job
    kind: Job
    result: fail
  - policy: disallow-default-namespace
    resources:
      - allowed-statefulset
    kind: StatefulSet
    result: pass
  - policy: disallow-default-namespace
    resources:
      - blocked-statefulset
    kind: StatefulSet
    result: fail

  ####
  # disallow latest tag
  ####
  - policy: disallow-latest-tag
    resources:
      - latest-pod
    kind: Pod
    result: fail
  - policy: disallow-latest-tag
    resources:
      - tagged-pod
    kind: Pod
    result: pass
  - policy: disallow-latest-tag
    resources:
      - no-tag-pod
    kind: Pod
    result: fail

  ####
  # pod disruption budget
  ####
  - policy: require-pod-disruption-budget
    resources:
      - pdb-skip-deployment
    kind: Deployment
    result: skip
  - policy: require-pod-disruption-budget
    resources:
      - pdb-missing-deployment
    kind: Deployment
    result: fail
  - policy: require-pod-disruption-budget
    resources:
      - pdb-present-deployment
    kind: Deployment
    result: pass

  ####
  # pod root fs read only
  ####
  - policy: require-readonly-root-filesystem
    resources:
      - writable-rootfs
    kind: Pod
    result: fail
  - policy: require-readonly-root-filesystem
    resources:
      - readonly-rootfs
    kind: Pod
    result: pass
