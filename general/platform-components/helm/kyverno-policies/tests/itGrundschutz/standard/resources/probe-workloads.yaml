---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-without-probe
spec:
  template:
    metadata:
      labels:
        app: test
    spec:
      restartPolicy: Always
      containers:
        - name: app
          image: nginx:1.27
  selector:
    matchLabels:
      app: test
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: daemonset-without-probe
spec:
  template:
    metadata:
      labels:
        app: test
    spec:
      restartPolicy: Always
      containers:
        - name: app
          image: nginx:1.27
  selector:
    matchLabels:
      app: test
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: statefulset-without-probe
spec:
  template:
    metadata:
      labels:
        app: test
    spec:
      restartPolicy: Always
      containers:
        - name: app
          image: nginx:1.27
  selector:
    matchLabels:
      app: test
  serviceName: test
---
apiVersion: batch/v1
kind: Job
metadata:
  name: job-without-probe
spec:
  template:
    metadata:
      labels:
        app: test
    spec:
      restartPolicy: Never
      containers:
        - name: app
          image: nginx:1.27
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob-without-probe
spec:
  schedule: 0 * * * *
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: test
        spec:
          restartPolicy: Never
          containers:
            - name: app
              image: nginx:1.27
---
apiVersion: v1
kind: Pod
metadata:
  name: job-pod
  ownerReferences:
    - apiVersion: batch/v1
      kind: Job
      name: owner
      uid: 00000000-0000-0000-0000-000000000001
      controller: true
spec:
  containers:
    - name: app
      image: nginx:1.27
---
apiVersion: v1
kind: Pod
metadata:
  name: deployment-pod
  ownerReferences:
    - apiVersion: apps/v1
      kind: ReplicaSet
      name: owner
      uid: 00000000-0000-0000-0000-000000000001
      controller: true
spec:
  containers:
    - name: app
      image: nginx:1.27
---
apiVersion: v1
kind: Pod
metadata:
  name: non-controller-job-reference
  ownerReferences:
    - apiVersion: batch/v1
      kind: Job
      name: owner
      uid: 00000000-0000-0000-0000-000000000001
      controller: false
spec:
  containers:
    - name: app
      image: nginx:1.27
---
apiVersion: v1
kind: Pod
metadata:
  name: other-api-job-reference
  ownerReferences:
    - apiVersion: example.com/v1
      kind: Job
      name: owner
      uid: 00000000-0000-0000-0000-000000000001
      controller: true
spec:
  containers:
    - name: app
      image: nginx:1.27
