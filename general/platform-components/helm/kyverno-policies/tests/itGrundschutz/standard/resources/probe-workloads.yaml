---
apiVersion: v1
kind: Pod
metadata:
  name: scope-pod-without-probe
  namespace: default
spec:
  containers:
    - name: app
      image: example.invalid/app:1
---
apiVersion: v1
kind: Pod
metadata:
  name: scope-pod-with-probe
  namespace: default
spec:
  containers:
    - name: app
      image: example.invalid/app:1
      readinessProbe:
        exec:
          command:
            - "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scope-deployment-without-probe
  namespace: default
spec:
  template:
    metadata:
      labels:
        app: deployment-without-probe
    spec:
      containers:
        - name: app
          image: example.invalid/app:1
  selector:
    matchLabels:
      app: deployment-without-probe
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scope-deployment-with-probe
  namespace: default
spec:
  template:
    metadata:
      labels:
        app: deployment-with-probe
    spec:
      containers:
        - name: app
          image: example.invalid/app:1
          readinessProbe:
            exec:
              command:
                - "true"
  selector:
    matchLabels:
      app: deployment-with-probe
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: scope-statefulset-without-probe
  namespace: default
spec:
  template:
    metadata:
      labels:
        app: statefulset-without-probe
    spec:
      containers:
        - name: app
          image: example.invalid/app:1
  selector:
    matchLabels:
      app: statefulset-without-probe
  serviceName: example
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: scope-statefulset-with-probe
  namespace: default
spec:
  template:
    metadata:
      labels:
        app: statefulset-with-probe
    spec:
      containers:
        - name: app
          image: example.invalid/app:1
          readinessProbe:
            exec:
              command:
                - "true"
  selector:
    matchLabels:
      app: statefulset-with-probe
  serviceName: example
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: scope-daemonset-without-probe
  namespace: default
spec:
  template:
    metadata:
      labels:
        app: daemonset-without-probe
    spec:
      containers:
        - name: app
          image: example.invalid/app:1
  selector:
    matchLabels:
      app: daemonset-without-probe
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: scope-daemonset-with-probe
  namespace: default
spec:
  template:
    metadata:
      labels:
        app: daemonset-with-probe
    spec:
      containers:
        - name: app
          image: example.invalid/app:1
          readinessProbe:
            exec:
              command:
                - "true"
  selector:
