---
apiVersion: batch/v1
kind: Job
metadata:
  name: scope-job-without-probe
  namespace: default
spec:
  template:
    metadata:
      labels:
        app: job-without-probe
    spec:
      containers:
        - name: app
          image: example.invalid/app:1
      restartPolicy: Never
---
apiVersion: batch/v1
kind: Job
metadata:
  name: scope-job-with-probe
  namespace: default
spec:
  template:
    metadata:
      labels:
        app: job-with-probe
    spec:
      containers:
        - name: app
          image: example.invalid/app:1
          readinessProbe:
            exec:
              command:
                - "true"
      restartPolicy: Never
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scope-cronjob-without-probe
  namespace: default
spec:
  schedule: 0 * * * *
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: cronjob-without-probe
        spec:
          containers:
            - name: app
              image: example.invalid/app:1
          restartPolicy: Never
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scope-cronjob-with-probe
  namespace: default
spec:
  schedule: 0 * * * *
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: cronjob-with-probe
        spec:
          containers:
            - name: app
              image: example.invalid/app:1
              readinessProbe:
                exec:
                  command:
                    - "true"
          restartPolicy: Never
---
apiVersion: v1
kind: Pod
metadata:
  name: scope-job-pod-never
  namespace: default
  ownerReferences:
    - apiVersion: batch/v1
      kind: Job
      name: test-job
      uid: a
      controller: true
spec:
  restartPolicy: Never
  containers:
    - name: app
      image: example.invalid/app:1
---
apiVersion: v1
kind: Pod
metadata:
  name: scope-job-pod-onfailure
  namespace: default
  ownerReferences:
    - apiVersion: batch/v1
      kind: Job
      name: test-job
      uid: a
      controller: true
spec:
  restartPolicy: OnFailure
  containers:
    - name: app
      image: example.invalid/app:1
---
apiVersion: v1
kind: Pod
