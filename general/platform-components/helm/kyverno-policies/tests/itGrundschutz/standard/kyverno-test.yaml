---
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: itGrundschutz-standard-test
policies:
  - /tmp/kyverno-itGrundschutz-standard.yaml
resources:
  - resources/pods.yaml
  - resources/namespaces.yaml
  - resources/probe-workloads.yaml
results:
  - policy: disallow-privileged-containers-itgrundschutz
    rule: privileged-containers
    resources:
      - unprivileged-pod
    kind: Pod
    result: pass
  - policy: disallow-privileged-containers-itgrundschutz
    rule: privileged-containers
    resources:
      - privileged-pod
    kind: Pod
    result: fail
  - policy: disallow-privilege-escalation-itgrundschutz
    rule: privilege-escalation
    resources:
      - no-escalation-pod
    kind: Pod
    result: pass
  - policy: disallow-privilege-escalation-itgrundschutz
    rule: privilege-escalation
    resources:
      - escalation-pod
    kind: Pod
    result: fail
  - policy: require-pod-probes
    rule: validate-probes
    resources:
      - pod-with-probe
    kind: Pod
    result: pass
  - policy: require-pod-probes
    rule: validate-probes
    resources:
      - pod-without-probe
    kind: Pod
    result: fail
  - policy: require-requests-limits
    rule: require-requests-limits
    resources:
      - pod-with-limits
    kind: Pod
    result: pass
  - policy: require-requests-limits
    rule: require-requests-limits
    resources:
      - pod-without-limits
    kind: Pod
    result: fail

  ###
  # create default-deny network
  ###
  - policy: create-default-network-policy-new-namespaces
    rule: create-default-deny-netpol-new-ns
    resources:
      - new-namespace
    kind: Namespace
    generatedResource: resources/generated-netpol.yaml
    result: pass
  - policy: create-default-network-policy-existing-namespaces
    rule: create-default-deny-netpol-existing-ns
    resources:
      - existing-namespace
    kind: Namespace
    generatedResource: resources/generated-netpol.yaml
    result: pass
  - policy: require-pod-probes
    rule: validate-probes
    resources:
      - scope-pod-without-probe
    kind: Pod
    result: fail
  - policy: require-pod-probes
    rule: validate-probes
    resources:
      - scope-pod-with-probe
    kind: Pod
    result: pass
  - policy: require-pod-probes
    rule: validate-probes
    resources:
      - scope-deployment-without-probe
    kind: Deployment
    result: fail
  - policy: require-pod-probes
    rule: validate-probes
    resources:
      - scope-deployment-with-probe
    kind: Deployment
    result: pass
  - policy: require-pod-probes
    rule: validate-probes
    resources:
      - scope-statefulset-without-probe
    kind: StatefulSet
    result: fail
  - policy: require-pod-probes
    rule: validate-probes
    resources:
      - scope-statefulset-with-probe
    kind: StatefulSet
    result: pass
  - policy: require-pod-probes
    rule: validate-probes
    resources:
      - scope-daemonset-without-probe
    kind: DaemonSet
    result: fail
  - policy: require-pod-probes
    rule: validate-probes
    resources:
      - scope-daemonset-with-probe
    kind: DaemonSet
    result: pass
  - policy: require-pod-probes
    rule: validate-probes
    resources:
      - scope-job-without-probe
    kind: Job
    result: skip
  - policy: require-pod-probes
    rule: validate-probes
    resources:
      - scope-job-with-probe
    kind: Job
    result: skip
  - policy: require-pod-probes
    rule: validate-probes
    resources:
      - scope-cronjob-without-probe
    kind: CronJob
    result: skip
  - policy: require-pod-probes
    rule: validate-probes
    resources:
      - scope-cronjob-with-probe
    kind: CronJob
    result: skip
  - policy: require-pod-probes
    rule: validate-probes
    resources:
      - scope-job-pod-never
    kind: Pod
    result: skip
  - policy: require-pod-probes
    rule: validate-probes
    resources:
      - scope-job-pod-onfailure
    kind: Pod
    result: skip
  - policy: require-pod-probes
    rule: validate-probes
    resources:
      - scope-standalone-never
    kind: Pod
    result: fail
  - policy: require-pod-probes
    rule: validate-probes
    resources:
      - scope-standalone-onfailure
    kind: Pod
    result: fail
