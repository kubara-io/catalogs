---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: too-many-dnsnames
spec:
  dnsNames:
    - example.com
    - kubara.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: one-dnsname
spec:
  dnsNames:
    - example.com
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: exact-long
spec:
  issuerRef:
    name: my-issuer
  duration: 2400h
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: too-long
spec:
  issuerRef:
    name: my-issuer
  duration: 2401
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: no-specified-duration
spec:
  issuerRef:
    name: my-issuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wrong-issuer
spec:
  dnsNames:
    - example.com
  issuerRef:
    name: my-issuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: corp-issuer
spec:
  dnsNames:
    - example.com
  issuerRef:
    name: approved-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: subdomain-approved-issuer
spec:
  dnsNames:
    - app.example.com
  issuerRef:
    name: approved-issuer
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-certificate
spec:
  dnsNames:
    - service.namespace.svc
  issuerRef:
    name: internal-issuer
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: uppercase-wrong-issuer
spec:
  dnsNames:
    - App.Example.Net
  issuerRef:
    name: other-issuer
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: common-name-wrong-issuer
spec:
  commonName: app.example.com
  issuerRef:
    name: other-issuer
    kind: ClusterIssuer
