{{- if and .Values.itGrundschutz.standard.enabled (dig "itGrundschutz" "standard" "disallowPrivilegedContainers" "enabled" true (merge .Values)) }}
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-privileged-containers-itgrundschutz
  annotations:
    policies.kyverno.io/title: Disallow Privileged Containers
    policies.kyverno.io/category: IT-Grundschutz (standard)
    policies.kyverno.io/severity: {{ dig "itGrundschutz" "standard" "disallowPrivilegedContainers" "severity" "medium" (merge .Values) }}
    policies.kyverno.io/minversion: "1.17.0"
    kyverno.io/kyverno-version: {{ .Values.global.kyvernoVersion | quote }}
    kyverno.io/kubernetes-version: {{ .Values.global.k8sVersion | quote }}
    policies.kyverno.io/subject: Container
    policies.kyverno.io/description: >-
      Privileged mode disables most security mechanisms and must not be allowed. This policy
      ensures Pods do not call for privileged mode.
      This Policy ensures IT-Grundschutz-rule: SYS.1.6.A17
spec:
  failurePolicy: {{ dig "itGrundschutz" "standard" "disallowPrivilegedContainers" "webhookFailurePolicy" "Fail" (merge .Values) }}
  webhookConfiguration:
    timeoutSeconds: 30
  evaluation:
    background:
      enabled: {{ dig "itGrundschutz" "standard" "disallowPrivilegedContainers" "enableBackgroundScanning" true (merge .Values) }}
  validationActions:
    - {{ $action := dig "itGrundschutz" "standard" "disallowPrivilegedContainers" "actionOverride" "Enforce" (merge .Values) }}{{ if eq $action "Enforce" }}Deny{{ else }}{{ $action }}{{ end }}
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
          - apps
          - batch
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
          - daemonsets
          - deployments
          - jobs
          - statefulsets
          - cronjobs
  variables:
    - name: podSpec
      expression: >-
        object.kind == 'Pod' ? object.spec :
        object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec :
        object.spec.template.spec
    - name: containers
      expression: >-
        variables.podSpec.?containers.orValue([])
        + variables.podSpec.?initContainers.orValue([])
        + variables.podSpec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.containers.all(c,
          !has(c.securityContext) || c.securityContext.?privileged.orValue(false) == false
        )
      message: >-
        Privileged mode is disallowed. The fields securityContext.privileged must be unset or set to `false`.
{{- end }}
