{{- if and .Values.itGrundschutz.base.enabled (dig "itGrundschutz" "base" "restrictImageRegistries" "enabled" true (merge .Values)) }}
{{- $allowedRegistries := dig "bestPractices" "restrictImageRegistries" "allowedRegistries" (list) (merge .Values) }}
{{- if not $allowedRegistries }}
{{- $allowedRegistries = dig "itGrundschutz" "base" "restrictImageRegistries" "allowedRegistries" (list "docker.io/*" "quay.io/*" "ghcr.io/*") (merge .Values) }}
{{- end }}
{{- $excludeNamespaces := dig "bestPractices" "restrictImageRegistries" "excludeNamespaces" (list) (merge .Values) }}
{{- if not $excludeNamespaces }}
{{- $excludeNamespaces = dig "itGrundschutz" "base" "restrictImageRegistries" "excludeNamespaces" (list "kube-system") (merge .Values) }}
{{- end }}
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict Image Registries
    policies.kyverno.io/category: IT-Grundschutz (base)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/minversion: "1.17.0"
    kyverno.io/kyverno-version: {{ .Values.global.kyvernoVersion | quote }}
    kyverno.io/kubernetes-version: {{ .Values.global.k8sVersion | quote }}
    policies.kyverno.io/subject: container
    policies.kyverno.io/description: >-
      Images from unknown, public registries can be of dubious quality and may not be
      scanned and secured, representing a high degree of risk. Requiring use of known, approved
      registries helps reduce threat exposure by ensuring image pulls only come from them.
      This policy ensures IT-Grundschutz-rules: SYS.1.6.A6, SYS.1.6.A12, SYS.1.6.A13
spec:
  failurePolicy: {{ dig "itGrundschutz" "base" "restrictImageRegistries" "webhookFailurePolicy" "Fail" (merge .Values) }}
  webhookConfiguration:
    timeoutSeconds: 30
  evaluation:
    background:
      enabled: {{ dig "itGrundschutz" "base" "restrictImageRegistries" "enableBackgroundScanning" true (merge .Values) }}
  validationActions:
    - {{ $action := dig "itGrundschutz" "base" "restrictImageRegistries" "actionOverride" "Audit" (merge .Values) }}{{ if eq $action "Enforce" }}Deny{{ else }}{{ $action }}{{ end }}
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
          - apps
          - batch
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
          - daemonsets
          - deployments
          - jobs
          - statefulsets
          - cronjobs
  {{- if $excludeNamespaces }}
  matchConditions:
    - name: exclude-namespaces
      expression: >-
        ![{{ range $i, $ns := $excludeNamespaces }}{{ if $i }}, {{ end }}'{{ $ns }}'{{ end }}].exists(ns, ns == object.metadata.?namespace.orValue(''))
  {{- end }}
  variables:
    - name: podSpec
      expression: >-
        object.kind == 'Pod' ? object.spec :
        object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec :
        object.spec.template.spec
    - name: containers
      expression: >-
        variables.podSpec.?containers.orValue([])
        + variables.podSpec.?initContainers.orValue([])
        + variables.podSpec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.containers.all(c,
          {{ range $i, $reg := $allowedRegistries }}{{ if $i }} || {{ end }}c.image.startsWith({{ $reg | replace "/*" "/" | quote }}){{ end }}
        )
      message: >-
        Unknown image registries. Expected all container images to match: {{ join " | " $allowedRegistries }}.
{{- end }}
