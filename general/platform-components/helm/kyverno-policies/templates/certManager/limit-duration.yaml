{{- if and .Values.certManager.enabled (dig "certManager" "limitDuration" "enabled" true (merge .Values)) }}
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: cert-manager-limit-duration
  annotations:
    policies.kyverno.io/title: Certificate max duration 100 days
    policies.kyverno.io/category: Cert-Manager
    policies.kyverno.io/severity: medium
    policies.kyverno.io/minversion: "1.17.0"
    kyverno.io/kyverno-version: {{ .Values.global.kyvernoVersion | quote }}
    kyverno.io/kubernetes-version: {{ .Values.global.k8sVersion | quote }}
    policies.kyverno.io/subject: Certificate
    policies.kyverno.io/description: >-
      Kubernetes managed non-letsencrypt certificates have to be renewed in every 100 days.
spec:
  failurePolicy: {{ dig "certManager" "limitDuration" "webhookFailurePolicy" "Fail" (merge .Values) }}
  webhookConfiguration:
    timeoutSeconds: 30
  evaluation:
    background:
      enabled: {{ dig "certManager" "limitDuration" "enableBackgroundScanning" false (merge .Values) }}
  validationActions:
    - {{ $action := dig "certManager" "limitDuration" "actionOverride" "Audit" (merge .Values) }}{{ if eq $action "Enforce" }}Deny{{ else }}{{ $action }}{{ end }}
  matchConstraints:
    resourceRules:
      - apiGroups:
          - cert-manager.io
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - certificates
  matchConditions:
    - name: non-letsencrypt
      expression: "!object.spec.?issuerRef.?name.orValue('').contains('letsencrypt')"
    - name: has-duration
      expression: "has(object.spec.duration) && object.spec.duration != ''"
  validations:
    - expression: >-
        (
          string(object.spec.duration).endsWith('h') ? int(string(object.spec.duration).substring(0, size(string(object.spec.duration)) - 1)) :
          string(object.spec.duration).endsWith('d') ? int(string(object.spec.duration).substring(0, size(string(object.spec.duration)) - 1)) * 24 :
          int(string(object.spec.duration))
        ) <= 2400
      message: "Certificate duration must be <= 2400h (100 days)."
{{- end }}
