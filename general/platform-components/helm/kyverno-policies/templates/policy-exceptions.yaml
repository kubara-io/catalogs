{{- range $policyName, $rules := (index .Values "kyverno-policies" "policyExclude" | default dict) }}
{{- range $i, $rule := $rules.any }}
---
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: {{ printf "%s-exception-%d" $policyName $i | replace "_" "-" | lower }}
  {{- if $rule.resources.namespaces }}
  namespace: {{ (first $rule.resources.namespaces) }}
  {{- else }}
  namespace: default
  {{- end }}
  annotations:
    policies.kyverno.io/title: {{ printf "Exception for %s" $policyName | quote }}
    policies.kyverno.io/category: PolicyException
spec:
  policyRefs:
    - name: {{ $policyName }}
      kind: ValidatingPolicy
  {{- if $rule.resources.names }}
  matchConditions:
    - name: match-names
      expression: >-
        [{{ range $nIdx, $n := $rule.resources.names }}{{ if $nIdx }}, {{ end }}'^{{ $n | replace "." "\\." | replace "*" ".*" }}$'{{ end }}].exists(pattern, object.metadata.name.matches(pattern))
  {{- end }}
{{- end }}
{{- end }}
