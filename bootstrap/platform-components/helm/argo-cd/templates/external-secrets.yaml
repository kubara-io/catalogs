{{- $ := . }}
{{- $globalStore := ($.Values.externalSecrets).secretStoreRef }}
{{- $stores := ($.Values.externalSecrets).secretStores }}
{{- range $name, $item := ($.Values.externalSecrets).secrets }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $item.name | default (printf "%s-es" $name ) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: {{ $.Release.Name }}
spec:
  refreshInterval: {{ $item.refreshInterval | default "5m" }}

  {{- $storeRef := $globalStore }}
  {{- if $item.secretStoreRef }}
    {{- if kindIs "string" $item.secretStoreRef }}
      {{- $storeRef = (get $stores $item.secretStoreRef) | default $globalStore }}
    {{- else }}
      {{- $storeRef = $item.secretStoreRef }}
    {{- end }}
  {{- end }}
  {{- with $storeRef }}
  secretStoreRef:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  target:
    name: {{ $item.target | default $name }}
    creationPolicy: Owner

  {{- if $item.data }}
  data:
    {{- range $dataItem := $item.data }}
    - secretKey: {{ $dataItem.secretKey }}
      remoteRef:
        key: {{ $dataItem.remoteKey }}
        {{- with $dataItem.remoteKeyProperty }}
        property: {{ . }}
        {{- end }}
        {{- with $dataItem.version }}
        version: {{ . }}
        {{- end }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Fail
    {{- end }}
  {{- else if $item.dataFrom }}
  dataFrom:
    {{- range $dataFromItem := $item.dataFrom }}
    - extract:
        key: {{ $dataFromItem.remoteKey }}
        {{- with $dataFromItem.remoteKeyProperty }}
        property: {{ . }}
        {{- end }}
        {{- with $dataFromItem.version }}
        version: {{ . }}
        {{- end }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Fail
    {{- end }}
  {{- end }}
---
{{- end }}
