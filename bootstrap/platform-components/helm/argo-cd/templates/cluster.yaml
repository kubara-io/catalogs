{{- range $key, $clusterItem := (.Values.bootstrapValues).cluster }}
{{- $authMethod := default "clientCertificate" $clusterItem.authMethod -}}
{{- if not $.Values.clusterCredentialRotator.enabled -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $clusterItem.name }}-es
  namespace: {{ default "argocd" $clusterItem.namespace }}
spec:
  refreshInterval: {{ default "5m" $clusterItem.refreshInterval }}
  secretStoreRef:
    kind: {{ $clusterItem.secretStoreRef.kind }}
    name: {{ $clusterItem.secretStoreRef.name }}
  target:
    name: {{ $clusterItem.name }}-cluster-secret
    creationPolicy: Owner
    template:
      metadata:
        {{- with $clusterItem.annotations }}
        annotations:
          {{- . | toYaml | nindent 10 }}
        {{- end }}
        labels:
          argocd.argoproj.io/secret-type: "cluster"
          {{- if $clusterItem.additionalLabels }}
          {{- $clusterItem.additionalLabels | toYaml | nindent 10 }}
          {{- end }}
      data:
        name: {{ $clusterItem.name }}
        {{- if $clusterItem.project }}
        project: {{ $clusterItem.project }}
        {{- end }}
        {{- if $clusterItem.namespaces }}
        namespaces: {{ $clusterItem.namespaces | join "," }}
        {{- end }}
        server: "{{ `{{ $k8sconfig := .config | fromYaml }}{{- $cluster := (index $k8sconfig.clusters 0) -}}{{ $cluster.cluster.server }}` }}"
        {{- if eq $authMethod "token" }}
        config: "{{ `{{ $k8sconfig := .config | fromYaml }}{{- $cluster := (index $k8sconfig.clusters 0) -}}{{- $user := (index $k8sconfig.users 0) -}}{{ printf \"{\\\"bearerToken\\\":%s,\\\"tlsClientConfig\\\":{\\\"caData\\\":%s,\\\"certData\\\":%s,\\\"insecure\\\":%s,\\\"keyData\\\":%s}}\" (index $user.user \"token\" | toJson) (index $cluster.cluster \"certificate-authority-data\" | toJson) (index $user.user \"client-certificate-data\" | toJson) \"false\" (index $user.user \"client-key-data\" | toJson) }}` }}"
        {{- else if eq $authMethod "clientCertificate" }}
        config: "{{ `{{ $k8sconfig := .config | fromYaml }}{{- $cluster := (index $k8sconfig.clusters 0) -}}{{- $user := (index $k8sconfig.users 0) -}}{{ printf \"{\\\"bearerToken\\\":\\\"\\\",\\\"tlsClientConfig\\\":{\\\"caData\\\":%s,\\\"certData\\\":%s,\\\"insecure\\\":%s,\\\"keyData\\\":%s}}\" (index $cluster.cluster \"certificate-authority-data\" | toJson) (index $user.user \"client-certificate-data\" | toJson) \"false\" (index $user.user \"client-key-data\" | toJson) }}` }}"
        {{- else }}
        {{- fail (printf "Unknown authMethod %q, must be either 'token' or 'clientCertificate'" $authMethod) }}
        {{- end }}
  data:
    - secretKey: config
      remoteRef:
        {{- if $clusterItem.remoteRef }}
        key: {{ $clusterItem.remoteRef.remoteKey }}
        {{- if $clusterItem.remoteRef.remoteKeyProperty }}
        property: {{ $clusterItem.remoteRef.remoteKeyProperty }}
        {{- end }}
        {{- else }}
        key: {{ $clusterItem.name }}
        {{- end }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Fail
---
{{- else }}
{{- /*
When automatic credential rotation is enabled, GitOps no longer renders an
ExternalSecret for the runtime Argo CD cluster credential. Instead, this empty
ConfigMap is the authoritative source of the cluster Secret's labels. The
credential rotator copies this complete label set onto the runtime Secret using
full replacement semantics.

Keep this ConfigMap in the Argo CD/rotator release namespace. The --namespace
flag used by `kubara bootstrap <spoke>` controls the kubara-agent namespace on
the spoke and is intentionally unrelated to this Hub-side namespace.
*/ -}}
{{- $configLabels := dict -}}
{{- with $clusterItem.additionalLabels }}
{{- range $labelKey, $labelValue := . }}
{{- $_ := set $configLabels $labelKey $labelValue -}}
{{- end }}
{{- end }}
{{- $_ := set $configLabels "argocd.argoproj.io/secret-type" "cluster" -}}
{{- $_ := set $configLabels $.Values.clusterCredentialRotator.secret.labelKey $.Values.clusterCredentialRotator.secret.labelValue -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $clusterItem.name }}{{ default "-config" $.Values.clusterCredentialRotator.secret.configMapSuffix }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- $configLabels | toYaml | nindent 4 }}
data: {}
---
{{- end }}
{{- end }}
