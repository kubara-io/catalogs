---
namespace: {}
externalSecrets: {}
dexRestarter:
  enabled: true
  image:
    repository: "alpine/kubectl"
    tag: "1.36.4"
  maxAttempts: "30"
  interval: "10"  # in seconds
  secretName: "oauth2-credentials"
defaultProject:
  name: default
  description: |-
    The default project is just here to validate your authentication.
    It is completely restricted and cannot be used to spawn any projects.
  clusterResourceBlacklist:
    - group: "*"
      kind: "*"
  clusterResourceWhitelist:
    - group: ""
      kind: ""
  destinations:
    - name: ""
      server: ""
  sourceRepos:
    - ""
argo-cd:
  createAggregateRoles: true
  notifications:
    enabled: false
  global:
    env:
      - name: "TZ"
        value: "Europe/Berlin"
    pdb:
      enabled: false
      minAvailable: 1
    replicas: 1
  dex:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 256Mi
    livenessProbe:
      enabled: true
    readinessProbe:
      enabled: true
  redis:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 256Mi
    livenessProbe:
      enabled: true
    readinessProbe:
      enabled: true
  applicationSet:
    pdb:
      enabled: false
      minAvailable: 1
    replicas: 1
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 512Mi
    livenessProbe:
      enabled: true
    readinessProbe:
      enabled: true
  server:
    replicas: 1
    pdb:
      enabled: false
      minAvailable: 1
    extraArgs:
      - --enable-gzip
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    serviceAccount:
      automountServiceAccountToken: true
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 512Mi
  configs:
    cm:
      exec.enabled: false
      server.rbac.log.enforce.enable: true
      jsonnet.enable: false
      resource.respectRBAC: "normal"
      accounts.wizard: login, apiKey
      accounts.wizard.enabled: true
      admin.enabled: false
      kustomize.buildOptions: "--enable-helm"
      repo.server.git.submodule.enabled: "false"
      resource.compareoptions: |
        ignoreResourceStatusField: all
      resource.customizations.ignoreDifferences.admissionregistration.k8s.io_MutatingWebhookConfiguration: |
        jqPathExpressions:
          - '.webhooks[].clientConfig.caBundle'
      resource.customizations.ignoreDifferences.admissionregistration.k8s.io_ValidatingWebhookConfiguration: |
        jqPathExpressions:
          - '.webhooks[].clientConfig.caBundle'
      resource.customizations.ignoreDifferences.apiextensions.k8s.io_CustomResourceDefinition: |
        jqPathExpressions:
          - '.spec.conversion.webhook.clientConfig.caBundle'
      resource.exclusions: |
        ### Velero Backups and dynamic runtime operations do not need to be managed by ArgoCD
        - apiGroups:
            - velero.io
          kinds:
            - Backup
            - Restore
            - DownloadRequest
            - DeleteBackupRequest
            - PodVolumeBackup
            - PodVolumeRestore
        ### Added via: helm inspect values argo/argo-cd|yq '.configs.cm."resource.exclusions"'
        ### Network resources created by the Kubernetes control plane and excluded to reduce the number of watched events and UI clutter
        - apiGroups:
            - ''
            - discovery.k8s.io
          kinds:
            - Endpoints
            - EndpointSlice
        ### Internal Kubernetes resources excluded reduce the number of watched events
        - apiGroups:
            - coordination.k8s.io
          kinds:
            - Lease
        ### Internal Kubernetes Authz/Authn resources excluded reduce the number of watched events
        - apiGroups:
            - authentication.k8s.io
            - authorization.k8s.io
          kinds:
            - SelfSubjectReview
            - TokenReview
            - LocalSubjectAccessReview
            - SelfSubjectAccessReview
            - SelfSubjectRulesReview
            - SubjectAccessReview
        ### Intermediate Certificate Request excluded reduce the number of watched events
        - apiGroups:
            - certificates.k8s.io
          kinds:
            - CertificateSigningRequest
        - apiGroups:
            - cert-manager.io
          kinds:
            - CertificateRequest
        ### Cert-Manager ACME issuance transients
        - apiGroups:
            - acme.cert-manager.io
          kinds:
            - Order
            - Challenge
        ### Cilium internal resources excluded reduce the number of watched events and UI Clutter
        - apiGroups:
            - cilium.io
          kinds:
            - CiliumIdentity
            - CiliumEndpoint
            - CiliumEndpointSlice
        ### Kyverno intermediate and reporting resources excluded reduce the number of watched events and improve performance
        - apiGroups:
            - kyverno.io
            - reports.kyverno.io
            - wgpolicyk8s.io
          kinds:
            - PolicyReport
            - ClusterPolicyReport
            - EphemeralReport
            - ClusterEphemeralReport
            - AdmissionReport
            - ClusterAdmissionReport
            - BackgroundScanReport
            - ClusterBackgroundScanReport
            - UpdateRequest
        ### Longhorn runtime state objects
        - apiGroups:
            - longhorn.io
          kinds:
            - Snapshot
            - Engine
            - Replica
            - Instance
    rbac:
      create: true
      policy.default: "role:authenticated"
      policy.authenticated.csv: |
        p, role:authenticated, projects, get, default, allow
      policy.wizard.csv: |
        p, wizard, applications, *, *, allow
        p, wizard, applicationsets, *, *, allow
        p, wizard, certificates, *, *, deny
        p, wizard, clusters, *, *, allow
        p, wizard, repositories, *, *, allow
        p, wizard, write-repositories, *, *, deny
        p, wizard, projects, *, *, allow
        p, wizard, accounts, update, *, allow
        p, wizard, gpgkeys, *, *, deny
        p, wizard, exec, create, */*, allow
  repoServer:
    pdb:
      enabled: false
      minAvailable: 1
    resources:
      requests:
        cpu: 250m
        memory: 1000Mi
      limits:
        memory: 1000Mi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
  controller:
    resources:
      requests:
        cpu: 250m
        memory: 2000Mi
      limits:
        memory: 2000Mi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
      rules:
        enabled: true
        spec:
          - alert: ArgoAppMissing
            expr: |
              absent(argocd_app_info) == 1
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "[Argo CD] No reported applications"
              description: >
                Argo CD has not reported any applications data for the past 15 minutes which
                means that it must be down or not functioning properly.  This needs to be
                resolved for this cloud to continue to maintain state.
          - alert: ArgoAppNotSynced
            expr: |
              argocd_app_info{sync_status!="Synced"} == 1
            for: 12h
            labels:
              severity: warning
            annotations:
              summary: "[{{`{{$labels.name}}`}}] Application not synchronized"
              description: >
                The application [{{`{{$labels.name}}`}} has not been synchronized for over
                12 hours which means that the state of this cloud has drifted away from the
                state inside Git.
          - alert: ArgoAppUnhealthy
            expr: |
              argocd_app_info{health_status!="Healthy"} != 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "[{{`{{$labels.name}}`}}] Application not synchronized"
              description: >-
                The application [{{`{{$labels.name}}`}} is currently not healthy.
