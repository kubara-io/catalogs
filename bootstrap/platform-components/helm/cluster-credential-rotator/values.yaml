---
cronJob:
  enabled: true
namespace: {}
schedule: "*/3 * * * *"
suspend: false
concurrencyPolicy: Forbid
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 3
startingDeadlineSeconds: 300
activeDeadlineSeconds: 300
backoffLimit: 1
image:
  repository: "alpine/kubectl"
  tag: "1.36.4"
  pullPolicy: IfNotPresent
serviceAccount:
  create: true
  name: "cluster-credential-rotator"
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi
secret:
  requiredType: "kubara.io/cluster-credentials"
  bootstrapKubeconfigKey: "bootstrapKubeconfig"
  kubeconfigKey: "kubeconfig"
  configMapSuffix: "-config"
agent:
  serviceAccountName: "kubara-agent"
  clusterRoleBindingName: "kubara-agent"
  clusterRoleName: "cluster-admin"
token:
  duration: "1h"
  refreshBefore: "15m"
targets:
  argo:
    enabled: true
    namespace: "argocd"
    secretSuffix: "-cluster-secret"
    configKey: "config"
  flux:
    enabled: false
    namespace: "flux-system"
    secretSuffix: "-kubeconfig"
    kubeconfigKey: "value"
clusters: []
